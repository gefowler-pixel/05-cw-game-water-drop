<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Drop Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <h1 class="game-title">Water Drop Challange</h1>
        <p class="game-tagline">Catch the good drops, avoid the bad ones!</p>
        <div class="score-panel">

<label for="difficulty">Difficulty:</label>
<select id="difficulty">
  <option value="easy">Easy</option>
  <option value="normal" selected>Normal</option>
  <option value="hard">Hard</option>
</select>

            <div class="score">Score: <span id="score">0</span></div>
            <div class="timer">Time: <span id="time">30</span>s</div>
            <button id="start-btn">Start Game</button>
            <button id="reset-btn">Reset</button>
        </div>
        <p id="message">Press Start to Begin!</p>
       <div id="game-container">
  <div class="game-brand">
  <img src="img/cw_logo-horizontal.png" alt="charity: water logo" width="180">
</div>
</div>
    </div>
    
<footer class="game-footer">
  <p>Every drop makes a difference!</p>
  <a href="https://www.charitywater.org/" target="_blank">Learn About charity: water</a>
  <a href="https://www.charitywater.org/donate" target="_blank">Donate to Clean Water</a>
</footer>

    <script src="script.js"></script>
</body>
</html>
